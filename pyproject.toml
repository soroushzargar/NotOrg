[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "notorg"
version = "0.1.0"
description = "A CLI note organizer that uses an LLM to categorize and search ideas"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
]

[project.scripts]
notorg = "notorg.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["notorg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
